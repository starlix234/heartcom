<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Reserva - Junta de Vecinos</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS Personalizado -->
    <link rel="stylesheet" href="/assets/css/reservas.css">
</head>
<body>

<div class="container my-5">
    <h2 class="text-center mb-4">Formulario de Reserva</h2>

    <form class="reservation-form mx-auto p-4 border rounded shadow-sm" style="max-width:600px;">
        
        <!-- Tipo de Reserva -->
        <div class="mb-3">
            <label for="tipoReserva" class="form-label">Tipo de Reserva</label>
            <select class="form-select" id="tipoReserva" required>
                <option value="" selected disabled>Seleccione tipo de reserva</option>
                <option value="cancha">Cancha</option>
                <option value="sala">Sala de Reuniones</option>
                <option value="piscina">Piscinas</option>
                <option value="areas-verdes">Áreas Verdes</option>
                <option value="plaza">Plazas de la Comunidad</option>
                <option value="sedes">Sedes</option>
            </select>
        </div>

                <!-- Fechas en la misma fila -->
        <div class="row g-3 mb-3">
            <div class="col-md-6">
                <label for="fechaInicio" class="form-label">Fecha de Inicio</label>
                <input type="date" class="form-control" id="fechaInicio" required>
            </div>

            <div class="col-md-6">
                <label for="fechaFin" class="form-label">Fecha de Fin</label>
                <input type="date" class="form-control" id="fechaFin" required>
            </div>
        </div>


        <!-- Asunto -->
        <div class="mb-3">
            <label for="asunto" class="form-label">Asunto</label>
            <input type="text" class="form-control" id="asunto" placeholder="Escriba el asunto" required>
        </div>

        <!-- Motivo -->
        <div class="mb-3">
            <label for="motivo" class="form-label">Motivo</label>
            <textarea class="form-control" id="motivo" rows="3" placeholder="Explique el motivo de la reserva" required></textarea>
        </div>

        <!-- Botón de Enviar -->
        <div class="d-grid">
            <button type="submit" class="btn btn-primary">Enviar Reserva</button>
        </div>

        <!-- Mensaje de inicio de sesión -->
        <p class="text-center mt-3 text-muted small">
            Debes iniciar sesión para ver tus reservas
        </p>
    </form>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
